<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>호랑이 우주 대작전</title>
<style>
:root{--bg:#05061a;--fg:#fff;--accent:#ffb020;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#05061a;--fg:#fff}}
:root[data-theme="dark"]{--bg:#05061a;--fg:#fff}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;touch-action:none;user-select:none}
#wrap{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;font-weight:700;font-size:16px;pointer-events:none;text-shadow:0 1px 3px #000}
#bar{position:absolute;top:36px;left:14px;right:14px;height:6px;background:#ffffff33;border-radius:3px;pointer-events:none}
#fill{height:100%;width:0;background:var(--accent);border-radius:3px}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#000a;padding:20px}
#msg h1{font-size:30px;margin:0 0 10px}
#msg p{margin:4px 0;font-size:16px;line-height:1.5}
button{margin-top:18px;font-size:20px;font-weight:700;padding:12px 32px;border:0;border-radius:28px;background:var(--accent);color:#222}
#board{position:absolute;top:50px;right:10px;font-size:13px;line-height:1.5;text-align:right;pointer-events:none;text-shadow:0 1px 3px #000;max-width:46%}
#nick{font-size:18px;padding:8px 12px;border-radius:12px;border:0;margin-top:10px;text-align:center;width:150px}
#fire{position:absolute;right:16px;bottom:calc(24px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;background:#ff4d4dcc;border:3px solid #fff;font-size:30px;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="hud"><span id="time">⏱ 3:00</span><span id="hp">❤️❤️❤️</span><span id="score">⭐ 0</span></div>
<div id="bar"><div id="fill"></div></div>
<div id="board"></div>
<div id="fire">💥</div>
<div id="msg"><h1>🐯 호랑이 우주 대작전</h1>
<p>화면을 누르고 있으면 그 방향으로 날아가요!<br>자동으로 총알이 나가요 (💥 버튼은 연속 발사)<br>PC: 방향키/WASD 이동, 스페이스 발사</p>
<p>바위를 피하고 적기를 물리쳐서<br><b>3분</b>을 버티면 승리!<br>같은 주소로 들어온 친구들과 함께 날아요!</p>
<p id="online">🌐 접속 중...</p><input id="nick" maxlength="8" placeholder="내 이름">
<button id="go">시작하기</button></div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H;
function rs(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
const $=id=>document.getElementById(id);
const TOTAL=180;
let P,rocks,enemies,bullets,ebullets,stars,parts,t,hp,score,state='ready',last=0,spawnR=0,spawnE=0,shotT=0,inv=0,keys={},target=null,fireHeld=false;
stars=[...Array(90)].map(()=>({x:Math.random()*3000,y:Math.random()*3000,s:Math.random()*2+.5,f:.2+Math.random()*.6}));
const JUNK=['🛰️','📡','🔩','🔧','🥫','🔋'];
function reset(){P={x:0,y:0,r:27,a:-Math.PI/2};rocks=[];enemies=[];bullets=[];ebullets=[];parts=[];t=0;hp=3;score=0;spawnR=0;spawnE=1.2;shotT=0;inv=0}
let myName='호랑이',done=0,room=null,peers=[],pt=0;
function start(){myName=($('nick')&&$('nick').value.trim())||'호랑이'+(Math.random()*90+10|0);done=0;reset();state='play';$('msg').style.display='none';last=performance.now();requestAnimationFrame(loop)}
$('go').onclick=start;
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener('pointerdown',e=>{target=pos(e)});
cv.addEventListener('pointermove',e=>{if(target)target=pos(e)});
addEventListener('pointerup',()=>{target=null});
$('fire').addEventListener('pointerdown',e=>{e.stopPropagation();fireHeld=true});
addEventListener('pointerup',()=>fireHeld=false);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key==' ')e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
const RING=()=>Math.hypot(W,H)/2+60;
function edgeSpawn(){const a=Math.random()*6.28,d=RING();return{x:P.x+Math.cos(a)*d,y:P.y+Math.sin(a)*d}}
function spawnRock(){const p=edgeSpawn(),k=Math.random();let o;
 const aim=Math.atan2(P.y-p.y+(Math.random()-.5)*300,P.x-p.x+(Math.random()-.5)*300);
 if(k<.35){const r=22+Math.random()*30,sp=35+Math.random()*40;o={type:'ice',e:'🧊',r,sp,wob:0,vr:(Math.random()-.5)*.8}}
 else if(k<.7){const r=12+Math.random()*20,sp=130+Math.random()*110+t*.6;o={type:'fire',e:'☄️',r,sp,wob:Math.random()<.4?60:0,vr:0}}
 else{const r=9+Math.random()*16,sp=60+Math.random()*90;o={type:'junk',e:JUNK[Math.random()*JUNK.length|0],r,sp,wob:Math.random()<.5?40:0,vr:(Math.random()-.5)*7}}
 Object.assign(o,{x:p.x,y:p.y,a:aim,rot:0,ph:Math.random()*6.28,hp:o.type==='ice'?2:0,t:0});
 if(o.type==='fire')o.rot=aim+Math.PI*.75;
 rocks.push(o)}
function spawnEnemy(){const p=edgeSpawn();enemies.push({x:p.x,y:p.y,r:18,hp:2,cd:1+Math.random(),a:0})}
function boom(x,y,c){for(let i=0;i<14;i++){const a=Math.random()*6.28,s=40+Math.random()*120;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.6,c})}}
function shoot(){let best=null,bd=1e9;for(const e of enemies){const d=Math.hypot(e.x-P.x,e.y-P.y);if(d<bd){bd=d;best=e}}
 if(best&&bd<RING()+40)P.a=Math.atan2(best.y-P.y,best.x-P.x);
 bullets.push({x:P.x+Math.cos(P.a)*20,y:P.y+Math.sin(P.a)*20,vx:Math.cos(P.a)*520,vy:Math.sin(P.a)*520})}
function hit(){if(inv>0)return;hp--;inv=1.5;boom(P.x,P.y,'#ff6060');if(navigator.vibrate)navigator.vibrate(120);if(hp<=0)end(false)}
function end(win){state='over';done=win?2:1;sendPres();$('msg').style.display='flex';
 $('msg').innerHTML=`<h1>${win?'🏆 승리! 3분 버텼어요!':'💥 아쉬워요!'}</h1><p>버틴 시간: ${Math.floor(t)}초</p><p>점수: ${score}</p><button id="go2">다시 하기</button>`;
 $('go2').onclick=start}
const far=o=>Math.hypot(o.x-P.x,o.y-P.y)>RING()+350;
function update(dt){
 t+=dt;if(t>=TOTAL){end(true);return}
 const sp=240;let dx=0,dy=0;
 if(keys.arrowleft||keys.a)dx--;if(keys.arrowright||keys.d)dx++;if(keys.arrowup||keys.w)dy--;if(keys.arrowdown||keys.s)dy++;
 if(dx||dy){const l=Math.hypot(dx,dy);P.x+=dx/l*sp*dt;P.y+=dy/l*sp*dt;P.a=Math.atan2(dy,dx)}
 else if(target){const ex=target.x-W/2,ey=target.y-H/2,d=Math.hypot(ex,ey);if(d>10){const m=Math.min(1,d/90)*sp*dt;P.x+=ex/d*m;P.y+=ey/d*m;P.a=Math.atan2(ey,ex)}}
 inv-=dt;shotT-=dt;
 if(shotT<=0){shoot();shotT=fireHeld||keys[' ']?.16:.45}
 spawnR-=dt;if(spawnR<=0){spawnRock();spawnR=Math.max(.3,.9-t/260)}
 spawnE-=dt;if(spawnE<=0){if(enemies.length<4+t/30)spawnEnemy();spawnE=Math.max(1.1,2.8-t/90)}
 for(const r of rocks){r.t+=dt;let vx=Math.cos(r.a)*r.sp,vy=Math.sin(r.a)*r.sp;
  if(r.wob){const w=Math.sin(r.t*3+r.ph)*r.wob;vx+=-Math.sin(r.a)*w;vy+=Math.cos(r.a)*w}
  r.x+=vx*dt;r.y+=vy*dt;r.rot+=r.vr*dt;
  if(Math.hypot(r.x-P.x,r.y-P.y)<r.r*.8+P.r-4){r.dead=1;hit();boom(r.x,r.y,r.type==='ice'?'#bfefff':r.type==='fire'?'#ff7a1a':'#aaa')}}
 rocks=rocks.filter(r=>!r.dead&&!far(r));
 for(const e of enemies){const a=Math.atan2(P.y-e.y,P.x-e.x),d=Math.hypot(P.x-e.x,P.y-e.y);e.a=a;
  const v=d>200?80:-20;e.x+=Math.cos(a)*v*dt;e.y+=Math.sin(a)*v*dt;
  e.cd-=dt;if(e.cd<=0&&d<RING()){e.cd=1.6;ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*190,vy:Math.sin(a)*190})}
  if(d<e.r+P.r-4){e.hp=0;hit()}}
 for(const b of ebullets){b.x+=b.vx*dt;b.y+=b.vy*dt;if(Math.hypot(b.x-P.x,b.y-P.y)<P.r){b.dead=1;hit()}}
 ebullets=ebullets.filter(b=>!b.dead&&!far(b));
 for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;
  for(const e of enemies)if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+4){b.dead=1;e.hp--;if(e.hp<=0){score+=100;boom(e.x,e.y,'#ffb020')}}
  for(const r of rocks)if(Math.hypot(b.x-r.x,b.y-r.y)<r.r*.8){b.dead=1;
   if(r.type==='ice'){r.hp--;if(r.hp<=0){r.dead=1;score+=20;boom(r.x,r.y,'#bfefff')}}}}
 enemies=enemies.filter(e=>e.hp>0&&!far(e));
 bullets=bullets.filter(b=>!b.dead&&Math.hypot(b.x-P.x,b.y-P.y)<RING());
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);
 const rem=Math.ceil(TOTAL-t);$('time').textContent='⏱ '+Math.floor(rem/60)+':'+String(rem%60).padStart(2,'0');
 $('hp').textContent='❤️'.repeat(Math.max(0,hp))+'🖤'.repeat(3-Math.max(0,hp));
 $('score').textContent='⭐ '+score;$('fill').style.width=(t/TOTAL*100)+'%';pt-=dt;if(pt<=0){pt=.12;sendPres();renderBoard()}}
function draw(){
 ctx.fillStyle='#05061a';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';
 for(const s of stars){const x=(((s.x-P.x*s.f)%W)+W)%W,y=(((s.y-P.y*s.f)%H)+H)%H;ctx.globalAlpha=.3+s.f/1.2;ctx.fillRect(x,y,s.s,s.s)}ctx.globalAlpha=1;
 ctx.save();ctx.translate(W/2-P.x,H/2-P.y);
 ctx.textAlign='center';ctx.textBaseline='middle';
 for(const r of rocks){ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.rot);
  if(r.type==='fire'){ctx.shadowColor='#ff6a00';ctx.shadowBlur=14}
  if(r.type==='ice'){ctx.shadowColor='#7fdcff';ctx.shadowBlur=10}
  ctx.font=r.r*2+'px serif';ctx.fillText(r.e,0,0);ctx.restore()}
 for(const p of peers){const q=p.presence||{};if(!q.al)continue;ctx.save();ctx.translate(q.x,q.y);ctx.globalAlpha=.85;
  ctx.save();ctx.rotate(q.a+Math.PI/2);ctx.scale(1.5,1.5);ctx.fillStyle='hsl('+hue(p.peer)+',80%,60%)';ctx.beginPath();ctx.moveTo(0,-24);ctx.lineTo(20,16);ctx.lineTo(0,8);ctx.lineTo(-20,16);ctx.closePath();ctx.fill();ctx.font='26px serif';ctx.fillText('🐯',0,-2);ctx.restore();
  ctx.font='bold 13px sans-serif';ctx.fillStyle='#fff';ctx.fillText(String(q.n||'').slice(0,8),0,-42);ctx.restore()}
 for(const e of enemies){ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.a+Math.PI/2);ctx.font='34px serif';ctx.fillText('🛸',0,0);ctx.restore()}
 ctx.fillStyle='#ff5050';for(const b of ebullets){ctx.beginPath();ctx.arc(b.x,b.y,5,0,6.28);ctx.fill()}
 ctx.fillStyle='#7df9ff';for(const b of bullets){ctx.beginPath();ctx.arc(b.x,b.y,4,0,6.28);ctx.fill()}
 for(const p of parts){ctx.globalAlpha=p.l/.6;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,4,4)}ctx.globalAlpha=1;
 if(inv<=0||Math.floor(inv*10)%2){ctx.save();ctx.translate(P.x,P.y);ctx.rotate(P.a+Math.PI/2);ctx.scale(1.5,1.5);
  ctx.fillStyle='#4aa8ff';ctx.beginPath();ctx.moveTo(0,-24);ctx.lineTo(20,16);ctx.lineTo(0,8);ctx.lineTo(-20,16);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ff9d00';ctx.beginPath();ctx.moveTo(-5,10);ctx.lineTo(0,22+Math.random()*6);ctx.lineTo(5,10);ctx.fill();
  ctx.font='26px serif';ctx.fillText('🐯',0,-2);ctx.restore()}
 ctx.restore()}

function sendPres(){if(!room)return;room.presence({n:myName,x:Math.round(P.x),y:Math.round(P.y),a:+P.a.toFixed(2),hp,s:score,al:state==='play'?1:0,d:done}).catch(()=>{})}
function hue(id){let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))%360;return h}
function renderBoard(){const el=$('board');if(!el)return;
 const rows=[{n:myName+' (나)',s:score,al:state==='play',d:done,hp}];
 for(const p of peers){const q=p.presence||{};rows.push({n:String(q.n||'?').slice(0,8),s:+q.s||0,al:!!q.al,d:q.d|0,hp:q.hp|0})}
 rows.sort((a,b)=>b.s-a.s);
 el.textContent='';for(const r of rows.slice(0,6)){const d=document.createElement('div');d.textContent=(r.d==2?'🏆':r.d==1?'💥':r.al?'🐯':'⏳')+' '+r.n+' '+r.s;el.appendChild(d)}
 const o=$('online');if(o)o.textContent='🌐 함께 접속 중: '+(peers.length+1)+'명'}
(async()=>{try{if(typeof claude!=='undefined'){room=await claude.use('room');if(room)room.onPeers(c=>{peers=c.peers.filter(p=>!p.isMe);renderBoard()},()=>{})}}catch(e){}if(!room){const o=$('online');if(o)o.textContent='🌐 혼자 하기 (온라인 연결 안 됨)'}})();
function loop(n){if(state!=='play'){draw();return}
 const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();if(state==='play')requestAnimationFrame(loop)}
reset();draw();
</script>
</body>
</html>
